# check.yml
# Ordered native and browser workspace verification
# =====================
# Compile real platform bindings before authenticated IPC and headed Compatible tests.
name: Workspace checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win32-x64
          - os: macos-15
            target: darwin-arm64
          - os: ubuntu-24.04
            target: linux-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # Physical GUI acceptance uses a separately authorized desktop session.
      ABR_GUI_E2E: '0'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
      - name: Verify host platform and prepare pinned dependencies
        run: |
          node release/ci-target.mjs ${{ matrix.target }}
          npm install --global corepack@0.34.6
          corepack enable
          corepack pnpm install --frozen-lockfile
      - name: Prepare pinned Rust compiler before native IPC
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.99.0
      - name: Verify actual macOS SDK and Swift toolchain
        if: runner.os == 'macOS'
        run: |
          # Enforce real framework compilation instead of documentation-only cross checking.
          test -z "${DOCS_RS:-}"
          xcrun --show-sdk-version
          xcrun --find swift
          swift --version
      - name: Validate and build native platform bindings
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          cargo build --workspace --locked
          # Require the real debug Agent so the integration test executes its IPC path.
          node --input-type=module -e "import {existsSync} from 'node:fs'; const executable='target/debug/abr-desktop-agent'+(process.platform==='win32'?'.exe':''); if (!existsSync(executable)) throw new Error('Compiled desktop Agent is required.');"
      - name: Validate TypeScript and repository boundaries
        run: |
          corepack pnpm typecheck
          corepack pnpm lint
      - name: Install official headed browser on Windows and macOS
        if: runner.os != 'Linux'
        run: corepack pnpm --filter @abr/playwright-worker exec playwright install chromium --no-shell
      - name: Install official browser and native runtime dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          corepack pnpm --filter @abr/playwright-worker exec playwright install chromium --with-deps --no-shell
          command -v xvfb-run
      - name: Run contracts, unit, MCP, IPC, and parity on Windows and macOS
        if: runner.os != 'Linux'
        run: corepack pnpm exec vitest run --config vitest.config.ts --exclude 'tests/e2e/compatible/**'
      - name: Run contracts, unit, MCP, IPC, and headed parity with Xvfb on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1920x1080x24' corepack pnpm exec vitest run --config vitest.config.ts --exclude 'tests/e2e/compatible/**'
      - name: Run actual headed Compatible fixtures on Windows and macOS
        if: runner.os != 'Linux'
        run: corepack pnpm test:compatible
      - name: Run actual headed Compatible fixtures with Xvfb on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1920x1080x24' corepack pnpm test:compatible
      - name: Verify local release integrity and Chromium preparation boundaries
        run: node --test release/update.test.mjs release/package.test.mjs chromium/build/budget.test.mjs chromium/build/pipeline.test.mjs experiments/research.test.mjs
