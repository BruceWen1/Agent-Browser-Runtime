schemaVersion: 1
runtime:
  defaultEngine: compatible
  logLevel: info
  artifactRetentionDays: 7
  maxSessions: 4
mcp:
  transport: stdio
browser:
  binary: bundled-chromium
  headless: false
  profileRoot: '${ABR_DATA_DIR}/profiles'
gui:
  requireForeground: true
  desktopInputConcurrency: 1
  allowScriptFallback: false
policy:
  allowedOrigins: ['http://127.0.0.1:*', 'http://localhost:*']
  deniedOrigins: []
  requireHumanApproval: ['file-upload', 'payment', 'send-message', 'delete']
  allowedUploadRoots: ['${ABR_DATA_DIR}/uploads']
privacy:
  redactSensitiveText: true
  persistScreenshots: false
  logUrlQuery: false
native:
  enabled: false
