[package]
name = "abr-desktop-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "abr-desktop-agent"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
base64 = "=0.22.1"
png = "=0.18.0"
getrandom = "=0.4.3"
hmac = "=0.12.1"
sha2 = "=0.10.9"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "=0.14.0", features = ["xtest", "xinput", "xkb"] }
zbus = "=5.19.0"

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "=11.0.0", features = ["macos_14_0"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_System_IO"] }
windows = { version = "=0.62.2", features = ["Foundation", "Graphics_Capture", "Graphics_DirectX", "Graphics_DirectX_Direct3D11", "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_WinRT", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_Ime", "Win32_UI_WindowsAndMessaging"] }
